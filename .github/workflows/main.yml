name: Automatic Release

on:
  push:
    branches:
      - main  # Adjust if your main branch is named 'master'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Dynamic Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0.${{ github.run_number }}"
          name: "Билети v2.0.${{ github.run_number }}"
          body: "По лесно използване и деплойване."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
